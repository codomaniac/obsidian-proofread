# Pushing a version tag (0.3.0, no `v`) builds the plugin and publishes the
# release Obsidian installs from: main.js, manifest.json and styles.css, with
# the changelog entry for that version as the notes.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check that the manifest agrees with the tag
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $version, the tag says $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Take the notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { on = index($0, " — " tag ":") > 0; next }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $GITHUB_REF_NAME." > notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file notes.md
          main.js manifest.json styles.css
